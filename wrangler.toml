name = "openclaw-docs-chat-proxy"
main = "src/worker.ts"
account_id = "91b59577e757131d68d55a471fe32aca"
compatibility_date = "2026-05-06"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "docs-chat.openclaw.ai/*", zone_name = "openclaw.ai" },
  { pattern = "documentation.openclaw.ai/ask-molty/*", zone_name = "openclaw.ai" },
  { pattern = "docs.openclaw.ai/ask-molty/*", zone_name = "openclaw.ai" },
]

[vars]
DOCS_INDEX_URL = "https://docs.openclaw.ai/docs-search.json"
DOCS_CORPUS_URL = "https://docs.openclaw.ai/llms-full.txt"
SOURCE_INDEX_URL = "https://docs.openclaw.ai/source-index.jsonl"
GITHUB_INDEX_URL = "https://github.com/openclaw/ask-molty/releases/download/workspace-latest/github-search.jsonl"
WORKSPACE_MANIFEST_URL = "https://docs.openclaw.ai/ask-molty/workspace-manifest.json"
OPENAI_MODEL = "chat-latest"
CLAWHUB_AUTH_URL = "https://clawhub.ai/auth/docs"
CLAWHUB_SESSION_VERIFY_URL = "https://clawhub.ai/api/v1/docs/session/verify"

[[r2_buckets]]
binding = "DOCS_ARTIFACTS"
bucket_name = "openclaw-docs"
