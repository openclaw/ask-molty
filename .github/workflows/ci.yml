name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ask Molty
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: npm ci

      - name: Checkout docs mirror
        uses: actions/checkout@v6
        with:
          path: docs-openclaw
          repository: openclaw/docs

      - name: Read source revision
        id: source
        working-directory: docs-openclaw
        run: |
          echo "sha=$(node -p 'JSON.parse(require("fs").readFileSync(".openclaw-sync/source.json", "utf8")).sha')" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenClaw source
        uses: actions/checkout@v6
        with:
          path: clawdbot5
          ref: ${{ steps.source.outputs.sha }}
          repository: openclaw/openclaw

      - name: Checkout gitcrawl store
        uses: actions/checkout@v6
        with:
          path: gitcrawl-store
          repository: openclaw/gitcrawl-store

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Export test workspace
        run: npm run export
        env:
          ASK_MOLTY_DOCS_REPO: docs-openclaw
          ASK_MOLTY_GITCRAWL_DB: gitcrawl-store/data/openclaw__openclaw.sync.db
          ASK_MOLTY_GITCRAWL_STORE: gitcrawl-store
          ASK_MOLTY_OUT_DIR: dist/test
          ASK_MOLTY_SOURCE_REPO: clawdbot5

      - name: Smoke test
        run: npm run smoke
